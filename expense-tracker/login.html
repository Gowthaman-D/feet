<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Smart Expense Tracker</title>
  <!-- Font Awesome Icons via CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Shared Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <main class="login-card">
    <header class="login-header">
      <div class="login-logo">
        <i class="fa-solid fa-vault"></i>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to access your Smart Expense Tracker</p>
    </header>

    <!-- Form submits directly to dashboard.html using standard HTML5 action -->
    <form action="dashboard.html" method="get" class="login-form">
      
      <div class="form-group">
        <label for="email" class="form-label">
          Email Address <span class="required">*</span>
        </label>
        <div style="position: relative;">
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="Enter your email" 
            required 
            autocomplete="email" 
                     >
          <span class="form-helper-text">We'll never share your financial details with anyone else.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">
          Password <span class="required">*</span>
        </label>
        <div style="position: relative;">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••••••" 
            required 
            minlength="8" 
            maxlength="20" 
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,20}" 
            title="Password must be 8-20 characters and include uppercase, lowercase, a number, and a special character."
          >
          <span class="form-helper-text">Must be 8-20 chars with uppercase, lowercase, number & special character.</span>
        </div>
      </div>

      <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 0.875rem;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-secondary);">
          <input type="checkbox" checked style="width: 16px; height: 16px; accent-color: var(--primary-blue);">
          Remember this device
        </label>
        <a href="dashboard.html" style="font-weight: 600;">Forgot Password?</a>
      </div>

      <div style="margin-top: 28px;">
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
        </button>
      </div>

    </form>

    <footer class="login-footer">
      <p>Don't have a banking account yet? <a href="dashboard.html">Create Account</a></p>
      <div style="margin-top: 16px; font-size: 0.75rem; color: var(--text-light); display: flex; justify-content: center; gap: 12px;">
        
      </div>
    </footer>
  </main>

</body>
</html>
