<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - RATIO</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <main class="login-card">
    
    <header class="login-header">
      <div class="login-logo">
        <i class="fa-solid fa-vault"></i>
      </div>
      <h1>Create Account</h1>
      <p>Join RATIO to start tracking your finances</p>
    </header>

    <form action="dashboard.html" method="get" class="login-form">
      
      <!-- Name Field -->
      <div class="form-group">
        <label for="name" class="form-label">
          Full Name <span class="required">*</span>
        </label>
        <div style="position: relative;">
          <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required minlength="2">
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">
          Email Address <span class="required">*</span>
        </label>
        <div style="position: relative;">
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">
          Password <span class="required">*</span>
        </label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required minlength="8" maxlength="20" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,20}" title="Password must be 8-20 characters and include uppercase, lowercase, a number, and a special character.">
          <span class="form-helper-text">Must be 8-20 chars with uppercase, lowercase, number & special character.</span>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirm-password" class="form-label">
          Confirm Password <span class="required">*</span>
        </label>
        <div style="position: relative;">
          <input type="password" id="confirm-password" name="confirm_password" class="form-control" placeholder="••••••••••••" required>
        </div>
      </div>

      <!-- T&C Checkbox -->
      <div class="form-group" style="margin-top: 16px; font-size: 0.875rem;">
        <label style="display: flex; align-items: start; gap: 8px; cursor: pointer; color: var(--text-secondary);">
          <input type="checkbox" required style="width: 16px; height: 16px; accent-color: var(--primary-blue); margin-top: 2px;">
          <span>I agree to the <a href="#" style="font-weight: 600;">Terms & Conditions</a> and <a href="#" style="font-weight: 600;">Privacy Policy</a>.</span>
        </label>
      </div>

      <div style="margin-top: 28px;">
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fa-solid fa-user-plus"></i> Sign Up
        </button>
      </div>

    </form>

    <footer class="login-footer">
      <p>Already have an account? <a href="login.html">Sign In</a></p>
      
      <div style="margin-top: 16px; font-size: 0.75rem; color: var(--text-light); display: flex; justify-content: center; gap: 12px;">
        <a href="#" style="color: var(--text-light); text-decoration: none;">Privacy Policy</a>
        <span>|</span>
        <a href="#" style="color: var(--text-light); text-decoration: none;">Terms of Service</a>
      </div>
    </footer>
  </main>

</body>
</html>
